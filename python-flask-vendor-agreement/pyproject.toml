[project]
name = "vendor-agreement"
version = "0.1.0"
description = "Vendor agreement example with PDF generation and Documenso signing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "documenso-sdk>=0.6.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "python-dotenv>=1.2.1",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
